name: vendor-check

# Proves on every push that the vendored mirror actually materialises.
#
# The failure this guards against is silent: 23 sources under vendor/hcs/old
# were submodule gitlinks with no URL mapping, so every clone got 23 empty
# directories and nothing failed until a build reached for one. Checking out with
# `submodules: recursive` and running the checker turns that silence into a red
# build.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Drift is not caused by anything in this repository, so nothing here will
    # notice it. A weekly run is the only way the gate fires when the vault
    # moves and no one has pushed.
    - cron: '17 4 * * 1'


jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Every vendored source must be present and mapped
        # Invoked through bash, not as ./script: the executable bit is not
        # preserved when the file is written by tooling, and a missing +x would
        # fail the guard for the wrong reason.
        run: bash scripts/check-vendor.sh

      - name: The vendored copy must be the vault's current copy
        # Only on main and on demand: a PR that has nothing to do with vendoring
        # should not fail because HCS moved. Every merge to main is deliberate,
        # so main is the right place to refuse a stale vault — and the weekly
        # schedule catches the case where nobody merges at all.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: bash scripts/check-vendor-current.sh

      - name: Report what is present
        if: always()
        run: |
          for d in vendor/hcs/old/*/; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "  OK    $(basename "$d")"
            else
              echo "  EMPTY $(basename "$d")"
            fi
          done
