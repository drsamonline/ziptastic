name: vendor-check

# Proves on every push that the vendored mirror actually materialises.
#
# The failure this guards against is silent: 23 sources under vendor/hcs/old
# were submodule gitlinks with no URL mapping, so every clone got 23 empty
# directories and nothing failed until a build reached for one. Checking out with
# `submodules: recursive` and running the checker turns that silence into a red
# build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Every vendored source must be present and mapped
        # Invoked through bash, not as ./script: the executable bit is not
        # preserved when the file is written by tooling, and a missing +x would
        # fail the guard for the wrong reason.
        run: bash scripts/check-vendor.sh

      - name: Report what is present
        if: always()
        run: |
          for d in vendor/hcs/old/*/; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "  OK    $(basename "$d")"
            else
              echo "  EMPTY $(basename "$d")"
            fi
          done
