;; Precomp Comfort v0.4.7 Windows 64-bit - ALPHA version - INI file
;; Use a semicolon (;) for comments

;; Compression method to use
;; 0 = none, 1 = bZip2, 2 = lzma2 multi-threaded
Compression_Method=0
;; Maximal memory (in MiB) for LZMA compression method
LZMA_Maximal_Memory=2048
;; Thread count for LZMA compression method
;; 0 = auto-detect
LZMA_Thread_Count=0
;; LZMA filters to use (up to 3 of the them can be combined)
;; X = x86, P = PowerPC, I = IA-64, A = ARM, T = ARM-Thumb
;; S = SPARC, D = delta (must be followed by distance 1..256))
;; The default is to disable all filters
; LZMA_Filters=XPIATSD2

;; Fast mode (on/off)
Fast_Mode=on

;; Intense mode (on/off)
Intense_Mode=off

;; Brute mode (on/off)
Brute_Mode=off

;; Preserve Input's file extension (on/off)
Preserve_Extension=off

;; Wrap BMP header around PDF images (on/off)
PDF_BMP_Mode=off

;; Recompress progressive JPGs only (on/off)
JPG_progressive_only=off

;; MJPEG recompression (on/off)
MJPEG_recompression=on

;; Minimal identical byte size
Minimal_Size=4

;; Verbose mode (on/off)
Verbose=off

;; Compression types to use
;; P = PDF, Z = ZIP, G = GZip, N = PNG, F = GIF, J = JPG, S = SWF
;; M = MIME Base64, B = bZip2, 3 = MP3
; Compression_Types_Enable=PZGNFJSMB3
; Compression_Types_Disable=PZGNFJSMB3

;; zLib levels to use
; zLib_Levels=
;; Maximal recursion depth to use
Maximal_Recursion_Depth=5

;; Use this to ignore streams at certain positions in the file
;; Separate positions with commas (,) or use multiple Ignore_Positions
; Ignore_Positions=0
