name: vendor-check

# Proves, on every push, that the vendored sources actually materialise.
#
# The failure this guards against is silent: `old/` once had 23 submodule
# gitlinks and no `.gitmodules`, so every clone got 23 empty directories and
# nothing failed until a build reached for one. Checking out with
# `submodules: recursive` and then running the checker turns that silence into
# a red build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Every vendored source must be present and mapped
        # Invoked through bash, not as ./script: the executable bit is not
        # preserved when the file is written by tooling, and a missing +x would
        # fail the guard for the wrong reason.
        run: bash scripts/check-vendor.sh

      - name: SOURCES must still describe old/
        # Blocking since 15 Nov 2026. It was advisory because seven findings
        # needed a decision, not a script: five vendored directories (BARF, BBB,
        # FLZP, FPAQF2, SR3A) had a row with no URL, and `csc` was listed in an
        # enforced table with nothing vendored under it. Both are settled — the
        # five carry the licence their own headers state, `csc` moved to Pending
        # Additions — so drift here is now a red build.
        run: python3 tools/check-sources.py

      - name: LICENSES must match the sources it describes
        # Every file in LICENSES/INDEX.json is re-hashed, every id in SOURCES must
        # have an entry, and every SPDX identifier used must have its text. A
        # notice edited or deleted without the record moving fails here.
        run: python3 tools/check-licences.py

      - name: Report what is present
        if: always()
        run: |
          echo "source directories with content:"
          for d in old/*/; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "  OK    $(basename "$d")"
            else
              echo "  EMPTY $(basename "$d")"
            fi
          done
